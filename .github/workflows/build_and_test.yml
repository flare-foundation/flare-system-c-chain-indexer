name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  BuildAndTestLibrary:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.5.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: "root"
          MYSQL_DATABASE: "flare_ftso_indexer_indexer_test"
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version-file: go.mod

      - name: Formatting check
        run: ./gofmt_check.sh

      - name: Lint
        uses: golangci/golangci-lint-action@v2
        with:
          version: latest
          args: --timeout 5m0s

      - name: Build
        run: go build ./...

      - name: Test
        # Everything but cmd/indexer, whose suite wants a second database that
        # MYSQL_DATABASE cannot create. The rest run on the one it does.
        run: go test ./internal/... ./test
