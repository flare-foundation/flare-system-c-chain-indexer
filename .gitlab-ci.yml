variables:
  GOPATH: /go
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: flare_ftso_indexer_indexer_test
  GOLANG_VERSION: "1.25.14-trixie@sha256:2c4c60ef415fbfa5e90300722293bef36c5e63fae17570ce18f580af933dbd73"
  GOLINT_VERSION: "v2.7.0"

.gocache:
  key: ${CI_COMMIT_REF_SLUG}
  policy: pull-push
  paths:
    - ${GOPATH}/pkg/mod
    - ${GOPATH}/bin

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  tags:
    - flarenetwork-md

build:
  stage: build
  image: golang:${GOLANG_VERSION}
  needs: []
  cache: !reference [.gocache]
  script:
    - go build ./...

lint:
  stage: test
  needs: []
  image: golangci/golangci-lint:${GOLINT_VERSION}
  cache: !reference [.gocache]
  script:
    - ./gofmt_check.sh
    - golangci-lint run --timeout 5m0s

test:
  stage: test
  image: golang:${GOLANG_VERSION}
  cache: !reference [.gocache]
  needs: []
  variables:
    DB_HOST: mysql
    DB_PORT: 3306
    DB_NAME: ${MYSQL_DATABASE}
    DB_USERNAME: root
    DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    MOCK_CHAIN_PORT: 2426
  services:
    - name: mysql:9.5.0
      alias: mysql
  # A hung service must not burn the hour-long default.
  timeout: 20m
  script:
    - sed -i 's/test_host = "localhost"/test_host = "mysql"/' test/config_test.toml
    # Everything but cmd/indexer, whose suite wants a second database that
    # MYSQL_DATABASE cannot create. The rest run on the one it does.
    - go test ./internal/... ./test
